name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline crawler tests
        run: python -m unittest discover -s tests -v
      - name: Validate lifecycle dataset
        run: python scripts/validate.py
      - name: Validate Autodesk documentation index
        run: python scripts/validate_autodesk_documentation.py
      - name: Validate community cross-validation data
        run: python scripts/validate_community_documentation.py
